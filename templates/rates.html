{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><p class="eyebrow">RATE MASTER</p><h1>⚙️ दर व्यवस्थापन</h1></div></div><form class="panel formgrid compact" method="post"><label>काम / सेवा<input name="service" placeholder="उदा. रोटाव्हेटर" required></label><label>दर (₹)<input type="number" step="0.01" name="rate" required></label><label>Unit<input name="unit" value="acre"></label><div><button class="btn primary">दर सेव्ह / अपडेट</button></div></form><div class="panel tablewrap"><table><tr><th>Service</th><th>Rate</th><th>Unit</th></tr>{% for r in rows %}<tr><td>{{r['service']}}</td><td><b>₹{{money(r['rate'])}}</b></td><td>{{r['unit']}}</td></tr>{% endfor %}</table></div>{% endblock %}
