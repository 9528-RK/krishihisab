{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><p class="eyebrow">EXPENSE MANAGEMENT</p><h1>💸 खर्च व्यवस्थापन</h1></div><div class="pill">एकूण खर्च: ₹{{money(total)}}</div></div><form class="panel formgrid compact" method="post"><label>तारीख<input type="date" name="expense_date" value="{{today}}" required></label><label>Category<input name="category" placeholder="Diesel / Repair / Salary" required></label><label>Amount (₹)<input type="number" step="0.01" name="amount" required></label><label>Description<input name="description"></label><div><button class="btn primary">＋ खर्च जोडा</button></div></form><div class="panel tablewrap"><table><tr><th>तारीख</th><th>Category</th><th>रक्कम</th><th>Description</th></tr>{% for e in rows %}<tr><td>{{e['expense_date']}}</td><td>{{e['category']}}</td><td class="danger">₹{{money(e['amount'])}}</td><td>{{e['description'] or '-'}}</td></tr>{% endfor %}</table></div>{% endblock %}
