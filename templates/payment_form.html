{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><p class="eyebrow">PAYMENT ENTRY</p><h1>💳 पेमेंट नोंदवा</h1></div></div><form class="panel formgrid" method="post"><label>ग्राहक *<select name="customer_id" required><option value="">ग्राहक निवडा</option>{% for c in customers %}<option value="{{c['id']}}">{{c['name']}} — {{c['village'] or ''}}</option>{% endfor %}</select></label><label>पेमेंट तारीख<input type="date" name="payment_date" value="{{today}}" required></label><label>रक्कम (₹) *<input type="number" step="0.01" min="0.01" name="amount" required></label><label>पेमेंट पद्धत<select name="mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select></label><label>Reference / UTR<input name="reference"></label><label>नोट्स<input name="notes"></label><div class="full"><div class="notice">ℹ️ ही रक्कम त्या ग्राहकाच्या सर्वात जुन्या बाकी कामांमध्ये आपोआप adjust केली जाईल.</div></div><div class="full actions"><button class="btn primary">पेमेंट सेव्ह करा</button><a class="btn" href="/payments">रद्द</a></div></form>{% endblock %}
