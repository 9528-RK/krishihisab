{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><p class="eyebrow">WORK ENTRY</p><h1>➕ नवीन काम नोंदवा</h1></div></div><form class="panel formgrid" method="post"><label>ग्राहक *<select name="customer_id" required><option value="">ग्राहक निवडा</option>{% for c in customers %}<option value="{{c['id']}}">{{c['name']}} — {{c['village'] or ''}}</option>{% endfor %}</select></label><label>तारीख *<input type="date" name="job_date" value="{{today}}" required></label><label>काम / सेवा *<select name="service" id="service" required>{% for r in rates %}<option value="{{r['service']}}" data-rate="{{r['rate']}}" data-unit="{{r['unit']}}">{{r['service']}}</option>{% endfor %}</select></label><label>Quantity<input type="number" step="0.01" name="quantity" id="qty" value="1"></label><label>Unit<input name="unit" id="unit" value="acre"></label><label>दर (₹)<input type="number" step="0.01" name="rate" id="rate" value="0"></label><label>एकूण (₹)<input type="number" step="0.01" id="total" readonly></label><label>आत्ताच जमा (₹)<input type="number" step="0.01" name="paid" value="0"></label><label class="full">नोट्स<textarea name="notes" placeholder="उदा. ट्रॅक्टर नंबर, शेताचा भाग..."></textarea></label><div class="full actions"><button class="btn primary">काम सेव्ह करा</button><a class="btn" href="/">रद्द</a></div></form><script>const s=document.querySelector('#service'),q=document.querySelector('#qty'),r=document.querySelector('#rate'),t=document.querySelector('#total'),u=document.querySelector('#unit');function calc(){t.value=((+q.value||0)*(+r.value||0)).toFixed(2)}function fill(){r.value=s.selectedOptions[0].dataset.rate;u.value=s.selectedOptions[0].dataset.unit;calc()}s.addEventListener('change',fill);q.addEventListener('input',calc);r.addEventListener('input',calc);fill();</script>{% endblock %}
